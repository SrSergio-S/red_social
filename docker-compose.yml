# ApuntesU se ejecuta SOLO con Docker:   docker compose up --build -d
# Luego abre http://localhost:5000 (en Codespaces: puerto 5000 en la pestaña Ports)
# Comandos de la app:  docker compose exec web python -m flask --app run <comando>
services:
  web:
    build: .
    image: apuntesu
    container_name: apuntesu
    ports:
      - "5000:5000"
    environment:
      # Cambia esta clave (o defínela en un archivo .env junto a este archivo: SECRET_KEY=...)
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-secreta}
      # Sincronización automática: guarda los cambios en datos/ unos segundos después (AUTO_GUARDAR).
      # Para subir datos/ a GitHub usa git en tu computador o Codespace (commit + push).
      AUTO_GUARDAR: ${AUTO_GUARDAR:-1}
    volumes:
      # Base de datos y archivos subidos en la carpeta instance/ del proyecto: se conservan aunque
      # borres o reconstruyas el contenedor.
      - ./instance:/app/instance
      # Carpeta datos/ del proyecto: el guardado automático la actualiza en tu computador y luego la
      # subes a GitHub con git
      - ./datos:/app/datos
    restart: unless-stopped
