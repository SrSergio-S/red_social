{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Iniciar sesión</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Correo</label><input class="form-control" type="email" name="email" required autofocus></div>
      <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="recordar" id="recordar"><label class="form-check-label" for="recordar">Recordarme</label></div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="mt-3 mb-0 small text-center">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
    <!--<p class="mt-2 mb-0 small text-center text-muted">Demo: ana@uni.edu / demo123</p>-->
  </div></div>
</div></div>
{% endblock %}
