{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Crear cuenta</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" value="{{ form.get('nombre', '') }}" required></div>
      <div class="mb-3"><label class="form-label">Correo institucional</label><input class="form-control" type="email" name="email" value="{{ form.get('email', '') }}" required></div>
      <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" minlength="6" required></div>
      <div class="row">
        <div class="col-8 mb-3"><label class="form-label">Carrera</label><input class="form-control" name="carrera" value="{{ form.get('carrera', '') }}"></div>
        <div class="col-4 mb-3"><label class="form-label">Semestre</label><input class="form-control" type="number" min="1" max="12" name="semestre" value="{{ form.get('semestre', '') }}"></div>
      </div>
      <button class="btn btn-primary w-100">Registrarme</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
