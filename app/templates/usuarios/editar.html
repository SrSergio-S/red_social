{% extends "base.html" %}
{% block titulo %}Editar perfil{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Editar perfil</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" name="nombre" value="{{ current_user.nombre }}" required></div>
      <div class="row">
        <div class="col-8 mb-3"><label class="form-label">Carrera</label><input class="form-control" name="carrera" value="{{ current_user.carrera or '' }}"></div>
        <div class="col-4 mb-3"><label class="form-label">Semestre</label><input class="form-control" type="number" min="1" max="12" name="semestre" value="{{ current_user.semestre or '' }}"></div>
      </div>
      <div class="mb-3"><label class="form-label">Sobre mí</label><textarea class="form-control" name="bio" rows="3">{{ current_user.bio or '' }}</textarea></div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" name="ofrece_tutorias" id="ot" {{ 'checked' if current_user.ofrece_tutorias }}>
        <label class="form-check-label" for="ot">Ofrezco tutorías personalizadas</label>
      </div>
      <button class="btn btn-primary">Guardar</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
